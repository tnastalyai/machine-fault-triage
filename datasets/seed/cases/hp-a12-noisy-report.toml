id = "hp-a12-noisy-report"
category = "noisy_report"
documents = ["velmora-aw90-service-manual"]

[report]
description = """
Good morning, I hope this reaches the right department. My name is Harriet Lindqvist and we had your heat pump put in last September, I can dig out the invoice number if you need it. I have to say I am really disappointed, we paid a lot of money for this. Anyway. Since Tuesday evening the display keeps switching between the temperature and A12 and the radiators are stone cold, the children are sleeping in their coats. My husband cleaned the strainer on Wednesday like the booklet says and it made no difference at all. Please call me on 0161 555 0142, best after five. Kind regards, Harriet"""
language = "en"

[expect]
status = "ok"
cause_terms = [["flow"], ["strainer", "vent", "air in", "pump"]]
report_keeps = ["A12", "Tuesday", "strainer", "radiators"]
report_omits = ["0142", "Harriet", "disappointed", "good morning", "regards", "invoice"]

[[expect.evidence]]
type = "document"
document_id = "velmora-aw90-service-manual"
page = 14
anchor = "A12"
