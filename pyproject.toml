[project]
name = "machine-fault-triage"
version = "0.0.1"
description = "Evidence-grounded fault triage for field service: heat pumps, HVAC, agricultural machinery."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.9",
]
keywords = ["rag", "llm", "field-service", "diagnostics", "evals"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.scripts]
machine-fault-triage = "machine_fault_triage.cli:main"

[project.urls]
Repository = "https://github.com/tnastalyai/machine-fault-triage"
Issues = "https://github.com/tnastalyai/machine-fault-triage/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machine_fault_triage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY", "D203", "D213", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR2004"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib -ra"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["machine_fault_triage"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
